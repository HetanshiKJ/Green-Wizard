        <script>
            document.addEventListener('DOMContentLoaded', function() {
            const containers = document.querySelectorAll('.container');
            const menuLinks = document.querySelectorAll('.menu a');
            let currentIndex = 0;

            function showContainer(index) {
                containers.forEach((container, i) => {
                    container.classList.toggle('active', i === index);
                });

                // Update menu link styling
                menuLinks.forEach(link => {
                    const targetId = link.getAttribute('data-target');
                    if (containers[index].id === targetId) {
                        link.style.backgroundColor = "#4c5145"; // Dark green background
                        link.style.color = "#F0F8E3"; // Light text
                    } else {
                        link.style.backgroundColor = ""; // Reset styles
                        link.style.color = ""; 
                    }
                });
            }

            document.querySelectorAll('.next-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    if (currentIndex < containers.length - 1) {
                        currentIndex++;
                        showContainer(currentIndex);
                    }
                });
            });

            document.querySelectorAll('.prev-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    if (currentIndex > 0) {
                        currentIndex--;
                        showContainer(currentIndex);
                    }
                });
            });

            menuLinks.forEach((link, index) => {
                link.addEventListener('click', event => {
                    event.preventDefault();
                    currentIndex = index; // Update the index when clicking menu links
                    showContainer(currentIndex);
                });
            });

            // Show first container by default
            showContainer(currentIndex);
        });

        </script>
